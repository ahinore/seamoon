<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earth-Moon Sim — Phase 1 / M1</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #hud {
        position: fixed; top: 8px; left: 8px; z-index: 10;
        font: 12px/1.6 ui-monospace, Consolas, monospace;
        color: #cfe3ff; background: rgba(0, 10, 25, 0.55);
        padding: 8px 10px; border-radius: 6px;
        white-space: pre; pointer-events: none;
      }
      #help {
        position: fixed; bottom: 8px; left: 8px; z-index: 10;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        color: #9fd8b0; background: rgba(0, 10, 25, 0.45);
        padding: 6px 9px; border-radius: 6px; pointer-events: none;
      }
      /* M10.8 reentry plasma: full-viewport overlay, opacity driven from JS.
         The hot core sits at the BOTTOM of the frame (velocity vector ahead
         of the craft on a nadir-facing camera). Keep the ellipse core inside
         the viewport (~85% height) so the glow is actually visible.
         M10.8b: punched-up alphas — with mix-blend screen over a bright
         daylit planet the old 0.55 core washed out to a pale veil. */
      #plasma {
        position: fixed; inset: 0; z-index: 5; pointer-events: none;
        opacity: 0;
        background:
          radial-gradient(ellipse 110% 62% at 50% 92%, rgba(255,244,205,1), rgba(255,150,40,0.9) 30%, rgba(215,60,10,0.55) 58%, rgba(120,18,4,0.3) 78%, transparent 92%),
          radial-gradient(ellipse 150% 48% at 50% -18%, rgba(255,140,45,0.5), transparent 72%);
        /* M10.8b: normal blend (not screen) — screen over a bright daylit
           planet washes the orange to pale cream; normal keeps the fire
           visible against any background. */
        mix-blend-mode: normal;
        transition: opacity 0.25s linear;
      }
      /* M11w15 3D nav map: small second WebGL scene (Earth, Moon, orbit
         ring, ship + forward ray), auto-framed; #radar is a transparent
         label overlay on top. Hidden below 40 km altitude. */
      #map3d {
        position: fixed; top: 8px; right: 8px; z-index: 10;
        width: 200px; height: 200px;
        border-radius: 10px; overflow: hidden;
        background: rgba(0, 10, 25, 0.55);
        border: 1px solid rgba(160, 200, 255, 0.35);
        pointer-events: none; display: none;
      }
      #map3d canvas { position: absolute; top: 0; left: 0; }
      /* M11w16 HUD direction arrows (Earth/Moon bearings on screen edges) */
      #dirs {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        z-index: 8; pointer-events: none; display: none;
      }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="plasma"></div>
    <div id="map3d"><canvas id="map3dgl" width="200" height="200"></canvas><canvas id="radar" width="200" height="200"></canvas></div>
    <canvas id="dirs"></canvas>
    <div id="help">クリックでマウス視点 / WASD 移動 / Q E 上下（惑星の真上方向） / Shift 加速 / 1-5 速度倍率 / G ワイヤー / H 初期位置へ / R 自動水平化切替 / F 飛行機モード（操縦桿=マウス・矢印 / W S スロットル / A D ラダー） / Esc マウス解放</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
